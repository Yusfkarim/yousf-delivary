name: Android Release

# Builds the signed release APK with the exact same pipeline that produces the
# Vercel download (deploy/apk/build-apk.sh → same keystore, same signature) and
# attaches it to a GitHub Release, so every version lives in «Releases».

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag / ref to build and publish (e.g. v1.6.9). Empty = current ref.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve ref
        id: ref
        run: |
          REF="${{ github.event.inputs.tag }}"
          if [ -z "$REF" ]; then REF="${GITHUB_REF_NAME}"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building: $REF"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The script installs its own JDK / Gradle / Android SDK into ~/tools,
      # restores the release keystore from android-app/release-keystore.b64 and
      # writes apk-out/YousifDelivery-v<version>.apk (+ .sha256).
      - name: Build release APK
        run: bash deploy/apk/build-apk.sh

      - name: Collect results
        id: apk
        run: |
          NAME=$(grep -m1 'versionName = ' android-app/app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          CODE=$(grep -m1 'versionCode = ' android-app/app/build.gradle.kts | sed 's/.*versionCode = \(.*\)/\1/')
          APK="apk-out/YousifDelivery-v${NAME}.apk"
          [ -f "$APK" ] || { echo "APK missing: $APK"; ls -l apk-out; exit 1; }
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ls -lh apk-out

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YousifDelivery-v${{ steps.apk.outputs.name }}
          path: |
            apk-out/*.apk
            apk-out/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.ref }}
          VN: ${{ steps.apk.outputs.name }}
          VC: ${{ steps.apk.outputs.code }}
          SHA: ${{ steps.apk.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<MD
          ## یوسف دلیڤەری v${VN} (${VC})

          فایلی دامەزراندن: **YousifDelivery-v${VN}.apk**

          ```
          sha256: ${SHA}
          ```

          ### دامەزراندن
          1. فایلی APK دابەزێنە
          2. لە مۆبایل «ڕێگەدان بە سەرچاوەی نەناسراو» چالاک بکە
          3. دامەزراندن → وشەی نهێنی → چوونەژوورەوە

          > هەمان keystore بەکارهاتووە، بۆیە بەسەرەوە دەبێتەوە بەبێ سڕینەوەی داتا.
          MD
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release exists — uploading assets"
            gh release upload "$TAG" apk-out/*.apk apk-out/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" apk-out/*.apk apk-out/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "یوسف دلیڤەری ${TAG}" \
              --notes-file "$NOTES" \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
